<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1>Minesweeper</h1>
        <a href="about.html" style="display: inline-block; margin-bottom: 15px; text-decoration: none; color: #007bff;">About the Game</a>
        <div class="controls">
            <div class="difficulty-selector">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty">
                    <option value="beginner">Beginner (9x9, 10 mines)</option>
                    <option value="intermediate">Intermediate (16x16, 40 mines)</option>
                    <option value="expert">Expert (16x30, 99 mines)</option>
                </select>
                <button id="new-game-btn">New Game</button>
            </div>
            <div class="game-info">
                <div id="mine-count">Mines: 0</div>
                <div id="timer">Time: 0</div>
            </div>
        </div>
        
        <div id="game-board" class="game-board"></div>
        
        <div id="game-message" class="game-message"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
